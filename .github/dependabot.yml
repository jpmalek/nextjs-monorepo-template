version: 2
updates:
  # NPM dependencies for the entire monorepo
  # Using 'npm' ecosystem because Dependabot treats pnpm as npm but respects pnpm-lock.yaml
  - package-ecosystem: "npm"
    directory: "/" # Checks the root for pnpm-workspace.yaml and package.json files
    schedule:
      interval: "weekly"
      day: "tuesday"    # Staggered with your existing Monday pnpm update script
      time: "04:00"     # UTC
      timezone: "Etc/UTC"
    target-branch: "staging"   # Aligns with your current PR strategy
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "deps"           # Conventional commit prefix for dependency updates
      prefix-development: "deps(dev)"  # Separate prefix for dev dependencies
      include: "scope"         # Include package scope in commit messages
    # Groups configuration - bundles related dependencies together for easier testing and review
    groups:
      # Production dependencies - patch and minor updates bundled together
      # This reduces PR noise while keeping major updates separate for careful review
      prod-dependencies-patch-and-minor:
        dependency-type: production  # Only runtime dependencies, not dev/build tools
        update-types:
          - patch    # Bug fixes and security patches
          - minor    # New features in existing major version

      # Development dependencies - patch and minor updates bundled together
      # Groups build tools, testing, linting, and development utilities
      dev-dependencies-patch-and-minor:
        dependency-type: development  # Only dev/build/test dependencies
        update-types:
          - patch    # Bug fixes and security patches
          - minor    # New features in existing major version

      # Major version updates - separate group for careful review
      # Major updates can include breaking changes and require more thorough testing
      major-updates:
        update-types:
          - major    # Breaking changes and major version bumps
        exclude-patterns:
          - 'pnpm'   # Keep pnpm version controlled by packageManager field in package.json

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/" # Checks for GitHub Actions workflow files in the .github/workflows directory
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "05:00"     # UTC, shortly after npm checks
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5 # Max 5 open PRs for GitHub Actions updates
    target-branch: "staging"
    labels:
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "chore(actions)" # Conventional commit prefix for GitHub Actions updates
      include: "scope"
    # Group all GitHub Actions updates together for easier review
    groups:
      github-actions-updates:
        patterns:
          - '*'      # Include all GitHub Actions
